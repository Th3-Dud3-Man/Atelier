name: TestFlight

# Compile, signe et envoie une version à TestFlight.
#
# Ce flux ne touche JAMAIS à vos clés Gemini ou Perplexity : elles vivent dans le trousseau
# de l'iPhone, saisies par vous dans les réglages de l'app, et n'ont rien à faire ici.
# Les secrets ci-dessous ne servent qu'à Apple : signer l'app et la déposer sur TestFlight.
#
# Il attend les secrets créés par le flux « Préparer la signature » : SIGNING_KEY_PEM,
# SIGNING_CERT_PEM, PROVISIONING_PROFILE_BASE64, APPLE_TEAM_ID — plus ASC_KEY_ID,
# ASC_ISSUER_ID et ASC_PRIVATE_KEY, que vous avez déposés à la main.
on:
  workflow_dispatch:
    inputs:
      notes:
        description: "Ce qui change dans cette version (visible dans TestFlight)"
        required: false
        default: "Nouvelle version de travail."

jobs:
  testflight:
    name: Construire et envoyer
    runs-on: macos-latest
    timeout-minutes: 60

    env:
      BUNDLE_ID: com.bureau.latelier
      SCHEME: Atelier

    steps:
      - uses: actions/checkout@v4

      - name: Choisir la version d'Xcode la plus récente
        timeout-minutes: 5
        run: |
          exec < /dev/null
          sudo xcode-select -s "$(ls -d /Applications/Xcode*.app | sort -V | tail -1)"
          xcodebuild -version

      # L'identité de signature est reconstituée ici, sur le Mac, à partir de la clé et du
      # certificat créés par le flux « Préparer la signature ». Elle est montée dans un
      # trousseau temporaire, propre à cette exécution, effacé à la fin.
      - name: Installer le certificat et le profil de distribution
        # Cinq minutes suffisent très largement : au-delà, c'est qu'une commande attend
        # une réponse que personne ne donnera jamais sur une machine sans clavier.
        timeout-minutes: 5
        env:
          SIGNING_KEY_PEM: ${{ secrets.SIGNING_KEY_PEM }}
          SIGNING_CERT_PEM: ${{ secrets.SIGNING_CERT_PEM }}
          PROVISIONING_PROFILE_BASE64: ${{ secrets.PROVISIONING_PROFILE_BASE64 }}
        run: |
          # L'entrée standard est fermée d'emblée. Si une commande se met malgré tout à
          # réclamer un mot de passe, elle reçoit une fin de fichier et échoue tout de
          # suite, au lieu d'attendre indéfiniment.
          exec < /dev/null
          set -euo pipefail
          umask 077

          etape() { echo "→ $1"; }

          if [ -z "${SIGNING_KEY_PEM:-}" ] || [ -z "${SIGNING_CERT_PEM:-}" ] \
             || [ -z "${PROVISIONING_PROFILE_BASE64:-}" ]; then
            echo "::error::Les secrets de signature manquent. Lancez d'abord le flux « Préparer la signature » : il les crée et les dépose lui-même."
            exit 1
          fi

          KEY_PATH="$RUNNER_TEMP/cle.pem"
          CERT_PATH="$RUNNER_TEMP/certificat.pem"
          P12_PATH="$RUNNER_TEMP/identite.p12"
          PROFILE_PATH="$RUNNER_TEMP/profil.mobileprovision"
          KEYCHAIN_PATH="$RUNNER_TEMP/signature.keychain-db"

          # Tirés au sort ici, oubliés avec la machine : ni l'un ni l'autre n'est un secret
          # du dépôt. `openssl rand` plutôt qu'un tube depuis /dev/urandom, qui peut rester
          # suspendu sur certaines machines.
          etape "mots de passe éphémères"
          P12_PASSWORD="$(openssl rand -hex 24)"
          KEYCHAIN_PASSWORD="$(openssl rand -hex 24)"

          etape "écriture de la clé, du certificat et du profil"
          printf '%s' "$SIGNING_KEY_PEM" > "$KEY_PATH"
          printf '%s' "$SIGNING_CERT_PEM" > "$CERT_PATH"
          printf '%s' "$PROVISIONING_PROFILE_BASE64" | base64 --decode > "$PROFILE_PATH"
          grep -q "PRIVATE KEY" "$KEY_PATH" || { echo "::error::SIGNING_KEY_PEM n'est pas une clé privée."; exit 1; }
          grep -q "BEGIN CERTIFICATE" "$CERT_PATH" || { echo "::error::SIGNING_CERT_PEM n'est pas un certificat."; exit 1; }
          [ -s "$PROFILE_PATH" ] || { echo "::error::Le profil est vide."; exit 1; }

          # /usr/bin/openssl est celui livré avec macOS. C'est délibéré : un OpenSSL 3
          # installé par Homebrew produirait une enveloppe que « security import » refuse.
          etape "assemblage de l'identité de signature"
          OPENSSL=/usr/bin/openssl
          [ -x "$OPENSSL" ] || OPENSSL=openssl
          "$OPENSSL" pkcs12 -export \
            -inkey "$KEY_PATH" -in "$CERT_PATH" -name "L'Atelier" \
            -passin "pass:" -passout "pass:$P12_PASSWORD" -out "$P12_PATH"

          etape "trousseau temporaire"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$P12_PATH" -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH" > /dev/null
          security list-keychain -d user -s "$KEYCHAIN_PATH"
          rm -f "$KEY_PATH" "$CERT_PATH" "$P12_PATH"

          etape "identités disponibles"
          security find-identity -v -p codesigning "$KEYCHAIN_PATH"

          # Xcode cherche les profils à cet endroit précis, sous leur UUID.
          etape "installation du profil"
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          PROFILE_PLIST="$(security cms -D -i "$PROFILE_PATH")"
          UUID=$(printf '%s' "$PROFILE_PLIST" | plutil -extract UUID raw -)
          NAME=$(printf '%s' "$PROFILE_PLIST" | plutil -extract Name raw -)
          cp "$PROFILE_PATH" "$HOME/Library/MobileDevice/Provisioning Profiles/$UUID.mobileprovision"
          echo "PROFILE_NAME=$NAME" >> "$GITHUB_ENV"
          echo "Profil installé : $NAME"

      - name: Écrire les options d'export
        timeout-minutes: 5
        run: |
          exec < /dev/null
          set -euo pipefail
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>teamID</key><string>${{ secrets.APPLE_TEAM_ID }}</string>
            <key>signingStyle</key><string>manual</string>
            <key>uploadSymbols</key><true/>
            <key>provisioningProfiles</key>
            <dict>
              <key>$BUNDLE_ID</key><string>$PROFILE_NAME</string>
            </dict>
          </dict>
          </plist>
          PLIST
          cat "$RUNNER_TEMP/ExportOptions.plist"

      - name: Archiver
        timeout-minutes: 40
        run: |
          exec < /dev/null
          set -euo pipefail
          set -o pipefail
          xcodebuild archive \
            -project Atelier.xcodeproj \
            -scheme "$SCHEME" \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/Atelier.xcarchive" \
            CODE_SIGN_STYLE=Manual \
            DEVELOPMENT_TEAM="${{ secrets.APPLE_TEAM_ID }}" \
            PROVISIONING_PROFILE_SPECIFIER="$PROFILE_NAME" \
            CODE_SIGN_IDENTITY="Apple Distribution" \
            CURRENT_PROJECT_VERSION=${{ github.run_number }} \
            | tee archive.log

      - name: Exporter l'ipa
        timeout-minutes: 15
        run: |
          exec < /dev/null
          set -euo pipefail
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/Atelier.xcarchive" \
            -exportPath "$RUNNER_TEMP/export" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist"
          ls -lh "$RUNNER_TEMP/export"

      - name: Envoyer à TestFlight
        timeout-minutes: 30
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
        run: |
          exec < /dev/null
          set -euo pipefail
          mkdir -p "$HOME/.appstoreconnect/private_keys"
          printf '%s' "$ASC_PRIVATE_KEY" > "$HOME/.appstoreconnect/private_keys/AuthKey_$ASC_KEY_ID.p8"
          IPA=$(ls "$RUNNER_TEMP/export"/*.ipa | head -1)
          xcrun altool --upload-app -f "$IPA" -t ios \
            --apiKey "$ASC_KEY_ID" --apiIssuer "$ASC_ISSUER_ID"

      - name: Rassembler les erreurs
        if: failure()
        timeout-minutes: 5
        run: |
          exec < /dev/null
          echo '## Ce que le compilateur a dit' >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          grep -E "(error|warning):" archive.log | sort -u | head -200 >> "$GITHUB_STEP_SUMMARY" \
            || echo "Rien dans le journal de compilation : l'échec est ailleurs (signature ou envoi)." \
               >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Garder les journaux
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: journaux
          path: |
            archive.log
          if-no-files-found: ignore

      - name: Effacer le trousseau temporaire
        if: always()
        timeout-minutes: 5
        run: |
          exec < /dev/null
          security delete-keychain "$RUNNER_TEMP/signature.keychain-db" || true
          rm -f "$HOME/.appstoreconnect/private_keys/"*.p8 || true
